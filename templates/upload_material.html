{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Course Material</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="login-container">

        <h1>Course Material</h1>
        <h2>Upload Course Material</h2>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Course Material Title</label>

            <input
                type="text"
                name="title"
                placeholder="Example: NLP Lecture 1"
                required
            >

            <label>Select PDF File</label>

            <input
                type="file"
                name="file"
                accept=".pdf"
                required
            >

            <button type="submit">
                Upload Material
            </button>

        </form>

    </div>

</body>
</html>
